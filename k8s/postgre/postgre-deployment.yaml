apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    service: postgres
  name: postgres
  namespace: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      service: postgres
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        service: postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-talos-vm-03
      containers:
        - name: postgres
          image: nexus.eqlan.ru/library/postgres:18.3
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgresql-pv
              mountPath: /var/lib/postgresql/data
            - name: init-data
              mountPath: /docker-entrypoint-initdb.d
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_PASSWORD } }
            - name: WIKI_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-secret, key: WIKI_DB_PASSWORD } }
            - name: N8N_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-secret, key: N8N_DB_PASSWORD } }
            - name: OLLAMA_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-secret, key: OLLAMA_DB_PASSWORD } }
      volumes:
        - name: postgresql-pv
          persistentVolumeClaim:
            claimName: postgresql-pv
        - name: init-data
          configMap:
            name: init-data
            defaultMode: 0755

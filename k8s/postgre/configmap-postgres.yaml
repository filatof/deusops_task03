apiVersion: v1
kind: ConfigMap
metadata:
  name: init-data
  namespace: postgres
data:
  init-databases.sh: |
    #!/bin/bash
    set -e

    create_app() {
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
        -v app_user="$1" -v app_pass="$2" -v app_db="$3" <<'EOSQL'
    SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'app_user', :'app_pass') \gexec
    SELECT format('CREATE DATABASE %I OWNER %I', :'app_db', :'app_user') \gexec
    EOSQL
    }

    create_app wiki   "$WIKI_DB_PASSWORD"   wikidb
    create_app n8n    "$N8N_DB_PASSWORD"    n8ndb
    create_app ollama "$OLLAMA_DB_PASSWORD" ollamadb
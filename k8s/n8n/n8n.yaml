apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
  labels:
    service: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      service: n8n
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        service: n8n
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/hostname: k8s-talos-vm-02
      initContainers:
        - name: volume-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown 1000:1000 /data"]
          volumeMounts:
            - name: n8n-claim
              mountPath: /data
      containers:
        - name: n8n
          image: nexus.eqlan.ru/n8nio/n8n:2.6.4
          command: ["/bin/sh"]
          args: ["-c", "sleep 5; n8n start"]
          ports:
            - containerPort: 5678
          env:
            # URL / прокси
            - name: N8N_HOST
              value: n8n.eqlan.org
            - name: N8N_PORT
              value: "5678"
            - name: N8N_PROTOCOL
              value: https
            - name: N8N_EDITOR_BASE_URL
              value: "https://n8n.eqlan.org/"
            - name: WEBHOOK_URL
              value: "https://n8n.eqlan.org/"
            - name: N8N_PROXY_HOPS
              value: "1"
            # База данных
            - name: DB_TYPE
              value: postgresdb
            - name: DB_POSTGRESDB_HOST
              value: postgres-service.postgres.svc.cluster.local
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: DB_POSTGRESDB_DATABASE
              value: n8ndb
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: n8n-secret
                  key: DB_POSTGRESDB_USER
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-secret
                  key: DB_POSTGRESDB_PASSWORD
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-secret
                  key: N8N_ENCRYPTION_KEY
            # Queue mode
            - name: EXECUTIONS_MODE
              value: queue
            - name: QUEUE_BULL_REDIS_HOST
              value: redis
            - name: QUEUE_BULL_REDIS_PORT
              value: "6379"
            - name: N8N_GRACEFUL_SHUTDOWN_TIMEOUT
              value: "30"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: n8n-claim
              mountPath: /home/node/.n8n
      volumes:
        - name: n8n-claim
          persistentVolumeClaim:
            claimName: n8n-claim
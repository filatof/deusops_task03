---
- name: Restore PostgreSQL databases from dumps
  hosts: postgre
  become: true

  vars:
    dump_archive: "base.tar.gz"
    dump_src: "files/{{ dump_archive }}"
    dump_dest: "/tmp/pg_dumps"
    dumps:
      - db: wikidb
        file: wikidb.sql
      - db: n8ndb
        file: n8ndb.sql
      - db: ollamadb
        file: ollamadb.sql

  tasks:
    - name: Create temp directory for dumps
      ansible.builtin.file:
        path: "{{ dump_dest }}"
        state: directory
        mode: '0755'

    - name: Copy archive to server
      ansible.builtin.copy:
        src: "{{ dump_src }}"
        dest: "/tmp/{{ dump_archive }}"
        mode: '0644'

    - name: Extract archive
      ansible.builtin.unarchive:
        src: "/tmp/{{ dump_archive }}"
        dest: "{{ dump_dest }}"
        remote_src: true

    - name: Restore each database
      ansible.builtin.shell: |
        sudo -u postgres psql -d {{ item.db }} < {{ dump_dest }}/{{ item.file }}
      loop: "{{ dumps }}"
      loop_control:
        label: "{{ item.db }}"

    - name: Cleanup temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/{{ dump_archive }}"
        - "{{ dump_dest }}"
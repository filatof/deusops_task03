# ============================================================
# Play 4: Deploy Ollama
# ============================================================
- name: Deploy Ollama
  hosts: ollama
  become: true

  tasks:
    - name: Create ollama directory
      ansible.builtin.file:
        path: "{{ ollama_app_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: Render .env for ollama
      ansible.builtin.template:
        src: templates/ollama_env.j2
        dest: "{{ ollama_app_dir }}/.env"
        owner: root
        group: root
        mode: '0600'
      notify: Restart ollama

    - name: Copy docker-compose for ollama (CPU)
      ansible.builtin.copy:
        src: files/ollama-postgre-docker-compose.yaml
        dest: "{{ ollama_app_dir }}/postgre-docker-compose.yaml"
        owner: root
        group: root
        mode: '0644'
      when: not ollama_gpu_enabled
      notify: Restart ollama

    - name: Copy docker-compose for ollama (GPU)
      ansible.builtin.copy:
        src: files/ollama-docker-compose-gpu.yaml
        dest: "{{ ollama_app_dir }}/postgre-docker-compose.yaml"
        owner: root
        group: root
        mode: '0644'
      when: ollama_gpu_enabled
      notify: Restart ollama

    - name: Start ollama
      community.docker.docker_compose_v2:
        project_src: "{{ ollama_app_dir }}"
        env_files:
          - "{{ ollama_app_dir }}/.env"
        state: present

    - name: Wait for ollama to be ready
      ansible.builtin.uri:
        url: "http://localhost:11434/api/tags"
        method: GET
        status_code: 200
      register: result
      until: result.status == 200
      retries: 10
      delay: 5

    - name: Pull ollama models
      ansible.builtin.shell: |
        docker exec ollama ollama pull {{ item }}
      loop: "{{ ollama_models }}"
      loop_control:
        label: "{{ item }}"
      changed_when: false

  handlers:
    - name: Restart ollama
      community.docker.docker_compose_v2:
        project_src: "{{ ollama_app_dir }}"
        env_files:
          - "{{ ollama_app_dir }}/.env"
        state: restarted
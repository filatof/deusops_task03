---
# ============================================================
# Install Docker via role (runs first on all servers)
# ============================================================
- name: Install Docker
  hosts: n8n, wiki, ollama, postgre
  become: true

  roles:
    - role: docker
      vars:
        docker_users:
          - fill
        docker_version: "5:29.4.0-1"
  tags:
    - docker

# ============================================================
# Deploy nginx
# ============================================================
- name: Deploy nginx
  hosts: bastion
  become: true
  tasks:
    - name: Create nginx directory
      ansible.builtin.file:
        path: "/etc/nginx/conf.d"
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: Copy site.crt
      ansible.builtin.copy:
        src: ssl/site.crt
        dest: "/etc/ssl/certs/site.crt"
        owner: root
        group: root
        mode: '0600'

    - name: Copy site.key
      ansible.builtin.copy:
        src: ssl/site.key
        dest: "/etc/ssl/certs/site.key"
        owner: root
        group: root
        mode: '0644'

    - name: Copy nginx.conf
      ansible.builtin.template:
        src: templates/nginx_conf.j2
        dest: "/etc/nginx/conf.d/nginx.conf"
        owner: root
        group: root
        mode: '0644'

    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: latest
        update_cache: yes
  tags:
    - nginx

# ============================================================
# Deploy Postgre
# ============================================================
- name: Deploy Postgre
  hosts: postgre
  become: true

  tasks:
    - name: Create Postgre directory
      ansible.builtin.file:
        path: "{{ postgre_app_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: Create directory for database init
      ansible.builtin.file:
        path: "{{ postgre_app_dir }}/docker-entrypoint-initdb.d"
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: Render initdb create users for postgre
      ansible.builtin.template:
        src: templates/01-create-users.sql.j2
        dest: "{{ postgre_app_dir }}/docker-entrypoint-initdb.d/01-create-users.sql"
        owner: root
        group: root
        mode: '0600'

    - name: Render initdb create database for postgre
      ansible.builtin.template:
        src: templates/02-create-databases.sql.j2
        dest: "{{ postgre_app_dir }}/docker-entrypoint-initdb.d/02-create-databases.sql"
        owner: root
        group: root
        mode: '0600'

    - name: Render .env for postgre
      ansible.builtin.template:
        src: templates/postgre_env.j2
        dest: "{{ postgre_app_dir }}/.env"
        owner: root
        group: root
        mode: '0600'
      notify: Restart postgre

    - name: Copy docker-compose for postgre
      ansible.builtin.copy:
        src: files/postgre-docker-compose.yaml
        dest: "{{ postgre_app_dir }}/docker-compose.yaml"
        owner: root
        group: root
        mode: '0644'
      notify: Restart postgre

    - name: Start postgre
      community.docker.docker_compose_v2:
        project_src: "{{ postgre_app_dir }}"
        env_files:
          - "{{ postgre_app_dir }}/.env"
        state: present

  handlers:
    - name: Restart postgre
      community.docker.docker_compose_v2:
        project_src: "{{ postgre_app_dir }}"
        env_files:
          - "{{ postgre_app_dir }}/.env"
        state: restarted

# ============================================================
# Restore postgre
# ============================================================
- name: Restore PostgreSQL databases from dumps
  hosts: postgre
  become: true

  vars:
    dump_archive: "base.tar.gz"
    dump_src: "files/{{ dump_archive }}"
    dump_dest: "/tmp/pg_dumps"
    dumps:
      - db: wikidb
        file: wikidb.sql
      - db: n8ndb
        file: n8ndb.sql
      - db: ollamadb
        file: ollamadb.sql

  tasks:
    - name: Create temp directory for dumps
      ansible.builtin.file:
        path: "{{ dump_dest }}"
        state: directory
        mode: '0755'

    - name: Copy archive to server
      ansible.builtin.copy:
        src: "{{ dump_src }}"
        dest: "/tmp/{{ dump_archive }}"
        mode: '0644'

    - name: Extract archive
      ansible.builtin.unarchive:
        src: "/tmp/{{ dump_archive }}"
        dest: "/tmp" #"{{ dump_dest }}"
        remote_src: true

    - name: Restore each database
      ansible.builtin.shell: |
        docker cp {{ dump_dest }}/{{ item.file }} postgres_container:/tmp/{{ item.file }}
        docker exec -e PGPASSWORD="{{ postgres_password }}" postgres_container \
          psql -U postgres -d {{ item.db }} -f /tmp/{{ item.file }}
        docker exec postgres_container rm /tmp/{{ item.file }}
      loop: "{{ dumps }}"
      loop_control:
        label: "{{ item.db }}"

    - name: Cleanup temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/{{ dump_archive }}"
        - "{{ dump_dest }}"

# ============================================================

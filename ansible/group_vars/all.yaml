---
# ===================================================================
# PostgreSQL Configuration
# ===================================================================
postgresql_install: true
postgresql_version: "18"  # или "latest"
postgresql_host: "10.10.1.4"  # IP сервера PostgreSQL
postgresql_port: 5432
postgres_password: "09876543"

# PostgreSQL listen address (remote connect)
postgresql_listen_addresses: "*"

# Database settings
postgresql_databases:
  - name: wikidb
    schema: public
    owner: wiki
    user: wiki
    password: "wiki_pass"
    extensions: []

  - name: n8ndb
    schema: public
    owner: n8n
    user: n8n
    password: "n8n_pass"
    extensions: []

  - name: ollamadb
    schema: public
    owner: ollama
    user: ollama
    password: "ollama_pass"
    extensions: []

# ===================================================================
# Configuration
# ===================================================================
# === n8n ===
n8n_app_dir: /opt/n8n
db_host: 10.10.1.4
db_port: 5432
db_name: n8ndb
db_user: n8n
db_schema: public
n8n_secure_cookie: "false"
n8n_runners_mode: internal
n8n_webhook_url: https://n8n.eqlan.org/
n8n_protocol: https
n8n_port: 5678
vault_db_password: "n8n_pass"

# === Wiki ===
wiki_app_dir: /opt/wiki
wiki_db_type: postgres
wiki_db_host: 10.10.1.4
wiki_db_port: 5432
wiki_db_user: wiki
wiki_db_name: wikidb
vault_wiki_db_password: "wiki_pass"

# === Ollama ===
ollama_app_dir: /opt/ollama
ollama_host: "0.0.0.0"
ollama_gpu_enabled: true


---
# ===================================================================
# Base configuration
# ===================================================================
domain_n8n:    "n8n.eqlan.org"
ip_addr_n8n:   10.10.1.3
domain_wiki:   "wiki.eqlan.org"
ip_addr_wiki:  10.10.1.5
# ===================================================================
# PostgreSQL Configuration
# ===================================================================
postgresql_install: true
postgresql_version: "18"  # или "latest"
postgresql_host: "10.10.1.4"  # IP сервера PostgreSQL
postgresql_port: 5432
postgres_user: postgres
postgres_password: "{{ vault_postgre_password }}"
postgre_app_dir: /opt/postgre
# PostgreSQL listen address (remote connect)
postgresql_listen_addresses: "*"

# ===================================================================
# Configuration
# ===================================================================
# === n8n ===
n8n_app_dir: /opt/n8n
db_host: "{{ postgresql_host }}"
db_port: "{{ postgresql_port }}"
n8n_db_user: n8n
n8n_db_name: n8ndb
n8n_db_password: "{{ vault_n8n_db_password }}"
db_schema: public
n8n_secure_cookie: "false"
n8n_runners_mode: internal
n8n_webhook_url: "https://n8n.eqlan.org/"
n8n_editor_base_url: "n8n.eqlan.org"
n8n_protocol: https
n8n_port: 5678
n8n_encryption_key: "{{ vault_n8n_encryption_key }}"

# === Wiki ===
wiki_app_dir: /opt/wiki
wiki_db_type: postgres
wiki_db_host: "{{ postgresql_host }}"
wiki_db_port: "{{ postgresql_port }}"
wiki_db_user: wiki
wiki_db_name: wikidb
wiki_db_password: "{{ vault_wiki_db_password }}"

#vault_wiki_db_password: "wiki_pass"

# === Ollama ===
ollama_app_dir: /opt/ollama
ollama_host: "0.0.0.0"
ollama_db_user: ollama
ollama_db_name: ollamadb
ollama_db_password: "{{ vault_ollama_db_password }}"
ollama_gpu_enabled: true
ollama_models:
  - qwen3:14b


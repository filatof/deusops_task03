services:
  # ============================================================
  # Redis — брокер очереди
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================
  # n8n-web — UI, API, триггеры, вебхуки
  # ============================================================
  n8n-web:
    image: n8nio/n8n:2.6.4
    container_name: n8n-web
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Database
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${DB_POSTGRESDB_HOST}
      DB_POSTGRESDB_PORT: ${DB_POSTGRESDB_PORT}
      DB_POSTGRESDB_DATABASE: ${DB_POSTGRESDB_DATABASE}
      DB_POSTGRESDB_USER: ${DB_POSTGRESDB_USER}
      DB_POSTGRESDB_PASSWORD: ${DB_POSTGRESDB_PASSWORD}
      DB_POSTGRESDB_SCHEMA: ${DB_POSTGRESDB_SCHEMA}
      # Queue mode
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      # Encryption key — должен совпадать у web и worker
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # Graceful shutdown — ждать завершения текущих задач (сек)
      N8N_GRACEFUL_SHUTDOWN_TIMEOUT: 30
      # n8n settings
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL}
      WEBHOOK_URL: ${WEBHOOK_URL}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ============================================================
  # n8n-worker — только выполнение воркфлоу
  # ============================================================
  n8n-worker:
    image: n8nio/n8n:2.6.4
    container_name: n8n-worker
    restart: unless-stopped
    command: worker --concurrency=10
    environment:
      # Database — тот же что у web
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${DB_POSTGRESDB_HOST}
      DB_POSTGRESDB_PORT: ${DB_POSTGRESDB_PORT}
      DB_POSTGRESDB_DATABASE: ${DB_POSTGRESDB_DATABASE}
      DB_POSTGRESDB_USER: ${DB_POSTGRESDB_USER}
      DB_POSTGRESDB_PASSWORD: ${DB_POSTGRESDB_PASSWORD}
      DB_POSTGRESDB_SCHEMA: ${DB_POSTGRESDB_SCHEMA}
      # Queue mode
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      # Encryption key — обязан совпадать с web
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # Graceful shutdown — воркер дождётся завершения текущих джобов
      N8N_GRACEFUL_SHUTDOWN_TIMEOUT: 30
      # Health check endpoint для воркера
      QUEUE_HEALTH_CHECK_ACTIVE: true
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      redis:
        condition: service_healthy
      n8n-web:
        condition: service_healthy

volumes:
  n8n_data:
  redis_data: